<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Knights of Eldoria</title>
  <style>
    html, body { margin:0; padding:0; background:#000; width:100%; height:100%; overflow:hidden; }
    #log {
      position:fixed; top:0; left:0; right:0; bottom:0; z-index:999;
      background:rgba(6,4,18,.96); color:#c0b0ff;
      font-family:monospace; font-size:13px;
      padding:12px; overflow-y:auto;
      pointer-events:none;
    }
    #log .ok  { color:#60e890; }
    #log .err { color:#ff6060; }
    #log .hd  { color:#ffd720; font-size:15px; font-weight:bold; margin-bottom:8px; }
    #back { position:fixed; bottom:8px; left:10px; z-index:1000;
            color:#9060e8; font-family:sans-serif; font-size:13px; text-decoration:none; }
  </style>
</head>
<body>
<div id="log">
  <div class="hd">⚔ Knights of Eldoria — Loading…</div>
  <div id="lines"></div>
</div>
<a id="back" href="index.html">← Back</a>

<script>
const lines = document.getElementById('lines');
function log(msg, cls) {
  const d = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = '[' + new Date().toLocaleTimeString() + '] ' + msg;
  lines.appendChild(d);
}

// Catch all JS errors
window.addEventListener('error', e => log('JS ERROR: ' + e.message + ' (' + e.filename + ':' + e.lineno + ')', 'err'));
window.addEventListener('unhandledrejection', e => log('PROMISE ERROR: ' + e.reason, 'err'));

log('Page loaded. Checking environment…');
log('Platform: ' + navigator.userAgent.substring(0, 80));

// Test CDN reachability
fetch('https://pygame-web.github.io/cdn/0.9.3/pythons.js', {method:'HEAD'})
  .then(r => log('CDN reachable: HTTP ' + r.status, r.ok ? 'ok' : 'err'))
  .catch(e => log('CDN UNREACHABLE: ' + e.message, 'err'));

// Test archive
fetch('knights-of-eldoria-.apk', {method:'HEAD'})
  .then(r => log('Archive reachable: HTTP ' + r.status + ' (' + r.headers.get('content-length') + ' bytes)', r.ok ? 'ok' : 'err'))
  .catch(e => log('Archive UNREACHABLE: ' + e.message, 'err'));

log('Loading pythons.js from CDN…');

// Hide log once canvas draws something (pygbag started)
let _hideTimer = null;
const _obs = new MutationObserver(() => {
  const cv = document.querySelector('canvas');
  if (cv && cv.width > 0) {
    log('Canvas active! Hiding debug log…', 'ok');
    setTimeout(() => document.getElementById('log').style.display = 'none', 2000);
    _obs.disconnect();
  }
});
_obs.observe(document.body, {childList:true, subtree:true, attributes:true});

if ('serviceWorker' in navigator)
  navigator.serviceWorker.register('./sw.js').catch(() => {});
</script>

<script src="https://pygame-web.github.io/cdn/0.9.3/pythons.js" type="module" defer>
{"autorun": true, "workers": false, "archive": "knights-of-eldoria-.apk"}
</script>

</body>
</html>
