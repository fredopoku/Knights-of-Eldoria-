<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knights of Eldoria</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body style="margin:0;background:#09071a;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui,sans-serif;">

  <div style="text-align:center;padding:2rem;max-width:420px;width:100%;">

    <img src="icon-192.png" alt="icon" style="width:80px;height:80px;border-radius:16px;margin-bottom:1rem;">

    <h1 style="color:#ffd720;font-size:2rem;margin:0 0 0.5rem;text-shadow:0 0 20px rgba(255,200,0,0.4);">
      Knights of Eldoria
    </h1>

    <p style="color:#a090c0;margin:0 0 1.5rem;font-size:0.95rem;line-height:1.5;">
      A dark fantasy simulation.<br>
      Become a hunter. Outwit the knights. Claim the treasure.
    </p>

    <button
      onclick="window.location.href='game.html'"
      style="display:block;width:100%;padding:1rem;background:#c8960a;border:none;border-radius:10px;color:#fff;font-size:1.1rem;font-weight:800;letter-spacing:0.08em;cursor:pointer;margin-bottom:1.5rem;text-transform:uppercase;">
      ▶ &nbsp;PLAY NOW
    </button>

    <div style="display:flex;flex-wrap:wrap;justify-content:center;gap:0.4rem;margin-bottom:1.5rem;">
      <span style="background:rgba(70,40,120,0.7);border:1px solid #5a3a9a;border-radius:20px;padding:0.25rem 0.7rem;font-size:0.75rem;color:#c8b8f0;">⚔ Hero Mode</span>
      <span style="background:rgba(70,40,120,0.7);border:1px solid #5a3a9a;border-radius:20px;padding:0.25rem 0.7rem;font-size:0.75rem;color:#c8b8f0;">🛡 3 Abilities</span>
      <span style="background:rgba(70,40,120,0.7);border:1px solid #5a3a9a;border-radius:20px;padding:0.25rem 0.7rem;font-size:0.75rem;color:#c8b8f0;">🌩 Wave System</span>
      <span style="background:rgba(70,40,120,0.7);border:1px solid #5a3a9a;border-radius:20px;padding:0.25rem 0.7rem;font-size:0.75rem;color:#c8b8f0;">👑 Boss Knights</span>
      <span style="background:rgba(70,40,120,0.7);border:1px solid #5a3a9a;border-radius:20px;padding:0.25rem 0.7rem;font-size:0.75rem;color:#c8b8f0;">🏆 25 Achievements</span>
    </div>

    <p style="color:#5a4880;font-size:0.72rem;">
      WASD/Arrow Keys to move &nbsp;·&nbsp; Q Dash &nbsp;·&nbsp; E Cloak &nbsp;·&nbsp; R Rally &nbsp;·&nbsp; ESC Pause
    </p>

  </div>

  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('./sw.js').catch(()=>{});
  </script>
</body>
</html>
